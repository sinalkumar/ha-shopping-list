license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore:Inheritance class HomeAssistantApplication.*:DeprecationWarning:homeassistant.components.http.server",
  "ignore:'asyncio.iscoroutinefunction'.*:DeprecationWarning:backoff.*",
]

[tool.coverage.run]
source = ["custom_components/smart_shopping_route"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py314"
line-length = 88
preview = true
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501", "RUF029"]

[tool.ruff.format]
quote-style = "double"
