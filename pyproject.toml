license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:Inheritance class HomeAssistantApplication.*:DeprecationWarning:homeassistant.components.http.server",
  "ignore:'asyncio.iscoroutinefunction'.*:DeprecationWarning:backoff.*",
]

[tool.ruff]
target-version = "py314"
line-length = 88
preview = true
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501", "RUF029"]

[tool.ruff.format]
quote-style = "double"
